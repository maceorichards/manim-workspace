# ManimGL project config. Keep ASCII only (manimlib reads it with the locale codec).
# Run manimgl from this directory so this file is picked up.
# Unset keys fall back to manimlib/default_config.yml.

camera:
  background_color: "#000000"
  fps: 30

text:
  font: "CMU Serif"
  alignment: "CENTER"

file_writer:
  saturation: 1.5

directories:
  # Renders land flat in videos/, named after the scene class.
  # mirror_module_path is left off: in 1.7.2 it crashes unless an absolute
  # removed_mirror_prefix is set, and it breaks snapshot.py's output path.
  mirror_module_path: False
  base: ""
  subdirs:
    output: "videos"

embed:
  autoreload: True
